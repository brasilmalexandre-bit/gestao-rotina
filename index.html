<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Painel">
<title>Painel — Alexandre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--surface:#fff;--col-bg:#f0efe9;--border:#e4e2da;--bh:#c8c5bb;--text:#1a1917;--muted:#7a7870;--accent:#2a2825;--green:#3a7a3a;--r:10px;--rs:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.nav{display:flex;align-items:center;border-bottom:0.5px solid var(--border);background:var(--surface);padding:0 1.5rem;position:sticky;top:0;z-index:50;gap:0}
.nav-title{font-size:15px;font-weight:500;margin-right:1.5rem;padding:13px 0;letter-spacing:-.3px;white-space:nowrap}
.nav-tab{font-size:14px;padding:0 16px;height:48px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px;display:flex;align-items:center}
.nav-tab:hover{color:var(--text)}
.nav-tab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:500}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
#saved-msg{font-size:12px;color:#5a8a5a;font-family:'DM Mono',monospace;opacity:0;transition:opacity .3s}
#saved-msg.show{opacity:1}
.nav-btn{height:28px;padding:0 10px;border:0.5px solid var(--border);border-radius:var(--rs);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;white-space:nowrap}
.nav-btn:hover{background:var(--col-bg)}
.page{display:none;padding:1.5rem;max-width:1100px;margin:0 auto}
.page.active{display:block}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem}
.stat{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:10px 12px}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-val{font-size:20px;font-weight:500;font-family:'DM Mono',monospace}
/* ADD */
.add-section{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:1.25rem}
.add-r1{display:flex;gap:8px;margin-bottom:8px}
.add-r2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-section input[type=text],.add-section input[type=date],.add-section select{height:36px;padding:0 10px;border:0.5px solid var(--border);border-radius:var(--rs);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .15s}
.add-section input:focus,.add-section select:focus{border-color:var(--bh)}
#new-title{flex:1;min-width:200px}
#new-due{width:148px}
.btn-add{height:36px;padding:0 18px;border:none;border-radius:var(--rs);background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;white-space:nowrap;transition:opacity .15s}
.btn-add:hover{opacity:.85}
/* FILTERS */
.filters{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:1rem;padding-bottom:4px}
.filters::-webkit-scrollbar{display:none}
.fbtn{font-size:13px;padding:8px 13px;border-radius:20px;border:0.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap;flex-shrink:0;min-height:36px;display:inline-flex;align-items:center}
.fbtn:hover{border-color:var(--bh);color:var(--text)}
.fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* VIEW TOGGLE */
.vtog{display:flex;gap:4px}
.vbtn{height:30px;padding:0 12px;border:0.5px solid var(--border);border-radius:var(--rs);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s}
.vbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.k-col{background:var(--col-bg);border-radius:var(--r);padding:10px;min-height:160px}
.k-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.k-col-title{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.k-count{font-size:12px;font-family:'DM Mono',monospace;background:var(--border);color:var(--muted);border-radius:20px;padding:1px 8px}
.k-cards{display:flex;flex-direction:column;gap:6px;min-height:40px}
/* CARDS */
.task-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:11px 12px;display:flex;align-items:flex-start;gap:9px;transition:border-color .15s}
.task-card:hover{border-color:var(--bh)}
.task-card.done{opacity:.5}
.task-card.done .task-title{text-decoration:line-through}
.task-card.overdue{border-left:3px solid #c0392b}
.check-btn{width:22px;height:22px;min-width:22px;border-radius:50%;border:1.5px solid var(--bh);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all .15s;padding:0;font-size:11px;color:transparent;flex-shrink:0}
.check-btn.done{background:var(--green);border-color:var(--green);color:#fff}
.task-body{flex:1;min-width:0}
.task-title{font-size:13px;color:var(--text);line-height:1.4;word-break:break-word}
.task-meta{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;align-items:center}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;font-family:'DM Mono',monospace}
.badge-produttare{background:#eeecfd;color:#3c3489}
.badge-iomt{background:#e3eef9;color:#0c447c}
.badge-mestrado{background:#fdf0dc;color:#633806}
.badge-ind4{background:#faeae3;color:#712b13}
.badge-pessoal{background:#f0efeb;color:#444441}
.badge-pri-alta{background:#fce8e8;color:#791f1f}
.badge-pri-media{background:#fdf0dc;color:#633806}
.badge-pri-baixa{background:#eaf3de;color:#27500a}
.due-tag{font-size:10px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:20px;border:0.5px solid var(--border);color:var(--muted)}
.due-tag.overdue{background:#fce8e8;color:#791f1f;border-color:transparent}
.due-tag.soon{background:#fdf0dc;color:#633806;border-color:transparent}
.due-tag.ok{background:#eaf3de;color:#27500a;border-color:transparent}
.date-hint{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace}
.task-actions{opacity:0;transition:opacity .15s;display:flex;gap:2px;flex-shrink:0}
.task-card:hover .task-actions{opacity:1}
.icon-btn{width:32px;height:32px;border:none;background:transparent;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:var(--rs);font-size:14px;transition:all .15s;flex-shrink:0}
.icon-btn:hover{background:#fce8e8;color:#791f1f}
.icon-btn.edit:hover{background:#e3eef9;color:#0c447c}
.empty-col{text-align:center;padding:1.5rem .5rem;color:var(--muted);font-size:13px}
.empty-list{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px}
.task-card.dragging{opacity:.35}
.k-col.drag-over{outline:2px dashed var(--bh);outline-offset:-4px}
.list-view{display:flex;flex-direction:column;gap:6px}
/* AGENDA */
.agenda-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.month-nav{display:flex;align-items:center;gap:8px}
.mnav-btn{width:40px;height:40px;border:0.5px solid var(--border);border-radius:var(--rs);background:transparent;cursor:pointer;font-size:18px;color:var(--text);display:flex;align-items:center;justify-content:center;transition:all .15s}
.mnav-btn:hover{background:var(--col-bg)}
.month-label{font-size:15px;font-weight:500;min-width:150px;text-align:center}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-dow{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--rs);min-height:76px;padding:6px 7px;cursor:pointer;transition:border-color .15s;overflow:hidden}
.cal-day:hover{border-color:var(--bh)}
.cal-day.other-month{background:var(--col-bg);opacity:.45}
.cal-day.today{border-color:var(--green);border-width:1.5px}
.cal-day.today .day-num{color:var(--green);font-weight:600}
.day-num{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);margin-bottom:3px}
.day-events{display:flex;flex-direction:column;gap:2px}
.day-event{font-size:10px;padding:1px 5px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.ev-M{background:#e3eef9;color:#0c447c}
.ev-T{background:#fdf0dc;color:#633806}
.ev-N{background:#f0efeb;color:#444441}
.ev-D{background:#eeecfd;color:#3c3489}
.ev-H{background:#E1F5EE;color:#085041}
.ev-feriado{background:#fce8e8;color:#791f1f}
/* DAY PANEL */
.day-panel{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.day-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.day-panel-title{font-size:14px;font-weight:500}
.day-panel-events{display:flex;flex-direction:column;gap:6px}
.dp-ev{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--rs);background:var(--bg);border:0.5px solid var(--border)}
.dp-period{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);width:14px;text-align:center;font-weight:600;flex-shrink:0}
.dp-text{flex:1;font-size:13px;line-height:1.4}
.dp-loc{font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;white-space:nowrap}
.dp-actions{display:flex;gap:2px;flex-shrink:0}
.dp-btn{width:32px;height:32px;border:none;background:transparent;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:var(--rs);font-size:13px;transition:all .15s}
.dp-btn:hover{background:#fce8e8;color:#791f1f}
.dp-btn.edit:hover{background:#e3eef9;color:#0c447c}
.dp-empty{font-size:13px;color:var(--muted);text-align:center;padding:1rem 0}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:var(--surface);border-radius:var(--r);padding:20px 22px;width:100%;max-width:480px;border:0.5px solid var(--border);max-height:90vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:16px}
.mfield{margin-bottom:12px}
.mfield label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px}
.mfield input,.mfield select{width:100%;padding:8px 10px;border:0.5px solid var(--border);border-radius:var(--rs);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .15s;height:40px}
.mfield input:focus,.mfield select:focus{border-color:var(--bh)}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mactions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.mactions-right{display:flex;gap:8px}
.btn-ghost{height:38px;padding:0 14px;border:0.5px solid var(--border);border-radius:var(--rs);background:transparent;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
.btn-danger{height:38px;padding:0 14px;border:none;border-radius:var(--rs);background:#fce8e8;color:#791f1f;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
.btn-primary{height:38px;padding:0 16px;border:none;border-radius:var(--rs);background:var(--accent);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
.btn-primary:hover{opacity:.85}
/* MOBILE */
@media(max-width:640px){
  .page{padding:.75rem}
  .kanban{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .nav{padding:0 1rem}
  .nav-title{font-size:14px;margin-right:.75rem}
  .add-r2{flex-direction:column;align-items:stretch}
  .add-section input[type=text],.add-section input[type=date],.add-section select,.btn-add{width:100%;height:44px;font-size:15px}
  #new-title{min-width:unset}
  .cal-grid,.cal-dows{gap:2px}
  .cal-day{min-height:58px;padding:4px 5px}
  .cal-dow{font-size:10px}
  .day-num{font-size:11px}
  .day-event{font-size:10px}
  .mrow{grid-template-columns:1fr}
  .mfield input,.mfield select{height:44px;font-size:15px}
  .agenda-top{gap:8px}
  .month-label{font-size:15px;min-width:130px}
  .vtog .vbtn{height:38px;font-size:14px}
  .nav-btn{height:32px;font-size:12px}
}
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-title">Painel</span>
  <button class="nav-tab active" onclick="showPage('tasks',this)">Tarefas</button>
  <button class="nav-tab" onclick="showPage('agenda',this)">Agenda</button>
  <div class="nav-right">
    <span id="saved-msg">salvo ✓</span>
    <button class="nav-btn" onclick="exportData()">&#11015; Export</button>
    <label class="nav-btn" style="cursor:pointer">&#11014; Import<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)"/></label>
  </div>
</nav>

<!-- TAREFAS -->
<div id="page-tasks" class="page active">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px">
    <div class="stats" style="margin-bottom:0;flex:1;min-width:260px">
      <div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="s-total">0</div></div>
      <div class="stat"><div class="stat-label">A fazer</div><div class="stat-val" id="s-todo">0</div></div>
      <div class="stat"><div class="stat-label">Andamento</div><div class="stat-val" id="s-prog">0</div></div>
      <div class="stat"><div class="stat-label">Vencidas</div><div class="stat-val" id="s-overdue" style="color:#c0392b">0</div></div>
    </div>
    <div class="vtog">
      <button class="vbtn" id="btn-list" onclick="setView('list')">Lista</button>
      <button class="vbtn active" id="btn-kanban" onclick="setView('kanban')">Kanban</button>
    </div>
  </div>

  <div class="add-section">
    <div class="add-r1"><input type="text" id="new-title" placeholder="Nova tarefa..."/></div>
    <div class="add-r2">
      <select id="new-frente">
        <option value="produttare">Produttare</option>
        <option value="iomt">i-OMT</option>
        <option value="mestrado">Mestrado</option>
        <option value="ind4">Ind. 4.0</option>
        <option value="pessoal">Pessoal</option>
      </select>
      <select id="new-pri"><option value="alta">Alta</option><option value="media">Media</option><option value="baixa">Baixa</option></select>
      <select id="new-status"><option value="todo">A fazer</option><option value="progress">Em andamento</option></select>
      <input type="date" id="new-due"/>
      <input type="text" id="new-obs" placeholder="Observacao (opcional)..." style="flex:2;min-width:160px"/>
      <button class="btn-add" onclick="addTask()">+ Adicionar</button>
    </div>
  </div>

  <div id="view-list" style="display:none">
    <div class="filters">
      <button class="fbtn active" onclick="setFilter('todas',this)">Todas</button>
      <button class="fbtn" onclick="setFilter('abertas',this)">Abertas</button>
      <button class="fbtn" onclick="setFilter('hoje',this)">Vencem hoje</button>
      <button class="fbtn" onclick="setFilter('amanha',this)">Vencem amanha</button>
      <button class="fbtn" onclick="setFilter('vencidas',this)">Vencidas</button>
      <button class="fbtn" onclick="setFilter('produttare',this)">Produttare</button>
      <button class="fbtn" onclick="setFilter('iomt',this)">i-OMT</button>
      <button class="fbtn" onclick="setFilter('mestrado',this)">Mestrado</button>
      <button class="fbtn" onclick="setFilter('ind4',this)">Ind. 4.0</button>
      <button class="fbtn" onclick="setFilter('alta',this)">Alta prioridade</button>
    </div>
    <div class="list-view" id="list-cards"></div>
  </div>

  <div id="view-kanban">
    <div class="filters" id="kanban-filters">
      <button class="fbtn active" onclick="setKFilter('todas',this)">Todas</button>
      <button class="fbtn" onclick="setKFilter('hoje',this)">Vencem hoje</button>
      <button class="fbtn" onclick="setKFilter('amanha',this)">Vencem amanha</button>
      <button class="fbtn" onclick="setKFilter('vencidas',this)">Vencidas</button>
      <button class="fbtn" onclick="setKFilter('produttare',this)">Produttare</button>
      <button class="fbtn" onclick="setKFilter('iomt',this)">i-OMT</button>
      <button class="fbtn" onclick="setKFilter('mestrado',this)">Mestrado</button>
      <button class="fbtn" onclick="setKFilter('ind4',this)">Ind. 4.0</button>
      <button class="fbtn" onclick="setKFilter('alta',this)">Alta prioridade</button>
    </div>
    <div class="kanban">
      <div class="k-col" id="col-todo" ondragover="onDragOver(event)" ondrop="onDrop(event,'todo')" ondragleave="onDragLeave(event)">
        <div class="k-col-header"><span class="k-col-title">A fazer</span><span class="k-count" id="cnt-todo">0</span></div>
        <div class="k-cards" id="cards-todo"></div>
      </div>
      <div class="k-col" id="col-progress" ondragover="onDragOver(event)" ondrop="onDrop(event,'progress')" ondragleave="onDragLeave(event)">
        <div class="k-col-header"><span class="k-col-title">Em andamento</span><span class="k-count" id="cnt-progress">0</span></div>
        <div class="k-cards" id="cards-progress"></div>
      </div>
      <div class="k-col" id="col-done" ondragover="onDragOver(event)" ondrop="onDrop(event,'done')" ondragleave="onDragLeave(event)">
        <div class="k-col-header"><span class="k-col-title">Concluido</span><span class="k-count" id="cnt-done">0</span></div>
        <div class="k-cards" id="cards-done"></div>
      </div>
    </div>
  </div>
</div>

<!-- AGENDA -->
<div id="page-agenda" class="page">
  <div class="agenda-top">
    <div class="month-nav">
      <button class="mnav-btn" onclick="changeMonth(-1)">&#8249;</button>
      <span class="month-label" id="month-label"></span>
      <button class="mnav-btn" onclick="changeMonth(1)">&#8250;</button>
    </div>
    <button class="btn-add" onclick="openNewEvent()">+ Novo evento</button>
  </div>
  <div class="cal-dows" id="cal-dows"></div>
  <div class="cal-grid" id="cal-body"></div>
  <div id="day-panel" style="display:none"></div>
</div>

<!-- TASK MODAL -->
<div class="overlay" id="modal-task" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Editar tarefa</h3>
    <div class="mfield"><label>Titulo</label><input type="text" id="e-title"/></div>
    <div class="mrow">
      <div class="mfield"><label>Frente</label>
        <select id="e-frente">
          <option value="produttare">Produttare</option><option value="iomt">i-OMT</option>
          <option value="mestrado">Mestrado</option><option value="ind4">Ind. 4.0</option>
          <option value="pessoal">Pessoal</option>
        </select>
      </div>
      <div class="mfield"><label>Prioridade</label>
        <select id="e-pri"><option value="alta">Alta</option><option value="media">Media</option><option value="baixa">Baixa</option></select>
      </div>
    </div>
    <div class="mrow">
      <div class="mfield"><label>Status</label>
        <select id="e-status"><option value="todo">A fazer</option><option value="progress">Em andamento</option><option value="done">Concluido</option></select>
      </div>
      <div class="mfield"><label>Previsao</label><input type="date" id="e-due"/></div>
    </div>
    <div class="mfield"><label>Observacao</label><input type="text" id="e-obs" placeholder="Nota rapida, contexto..."/></div>
    <div class="mactions">
      <div></div>
      <div class="mactions-right">
        <button class="btn-ghost" onclick="document.getElementById('modal-task').style.display='none'">Cancelar</button>
        <button class="btn-primary" onclick="saveTaskEdit()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<!-- EVENT MODAL -->
<div class="overlay" id="modal-event" style="display:none" onclick="if(event.target===this)this.style.display='none'">
  <div class="modal" onclick="event.stopPropagation()">
    <h3 id="ev-modal-title">Novo evento</h3>
    <div class="mfield"><label>Descricao</label><input type="text" id="ev-text" placeholder="Ex: Reuniao Tirolez"/></div>
    <div class="mfield"><label>Observacao</label><input type="text" id="ev-obs" placeholder="Detalhes, pauta, contato..."/></div>
    <div class="mrow">
      <div class="mfield"><label>Data</label><input type="date" id="ev-date"/></div>
      <div class="mfield"><label>Periodo</label>
        <select id="ev-period" onchange="toggleTimeField()">
          <option value="D">Dia todo</option>
          <option value="M">Manha</option>
          <option value="T" selected>Tarde</option>
          <option value="N">Noite</option>
          <option value="H">Horario especifico</option>
        </select>
      </div>
    </div>
    <div class="mrow" id="ev-time-field" style="display:none">
      <div class="mfield"><label>De</label><input type="time" id="ev-time" value="08:00"/></div>
      <div class="mfield"><label>Ate</label><input type="time" id="ev-time-end" value="09:00"/></div>
    </div>
    <div class="mrow">
      <div class="mfield"><label>Local</label><input type="text" id="ev-location" placeholder="Ex: Porto Alegre, Zoom..."/></div>
      <div class="mfield"><label>Recorrencia</label>
        <select id="ev-recur" onchange="toggleRecurField()">
          <option value="none">Nao repete</option>
          <option value="weekly">Semanal</option>
          <option value="biweekly">Quinzenal</option>
          <option value="monthly">Mensal</option>
          <option value="daily">Diaria</option>
        </select>
      </div>
    </div>
    <div class="mfield" id="ev-recur-end-field" style="display:none">
      <label>Repetir ate</label>
      <input type="date" id="ev-recur-end"/>
    </div>
    <div class="mactions">
      <button class="btn-danger" id="ev-del-btn" style="display:none" onclick="deleteEvent()">Excluir</button>
      <div class="mactions-right">
        <button class="btn-ghost" onclick="document.getElementById('modal-event').style.display='none'">Cancelar</button>
        <button class="btn-primary" onclick="saveEvent()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script>
const TASK_KEY='alex-tasks-v3', EVENT_KEY='alex-events-v1';
let tasks=[], events=[];
let filter='todas', kfilter='todas', taskView='kanban';
let dragId=null, editTaskId=null, editEventId=null;
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth();
let selectedDate=null;

const LABELS={produttare:'Produttare',iomt:'i-OMT',mestrado:'Mestrado',ind4:'Ind. 4.0',pessoal:'Pessoal'};
const PRI={alta:'Alta',media:'Media',baixa:'Baixa'};
const MONTHS=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DOWS=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];

function todayStr(){return new Date().toISOString().slice(0,10)}
function daysUntil(d){if(!d)return null;return Math.ceil((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/86400000)}
function fmtDate(d){if(!d)return null;const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+y}
function dueClass(d,done){if(!d||done)return'';const n=daysUntil(d);return n<0?'overdue':n<=1?'soon':'ok'}
function dueTxt(d,done){if(!d)return null;const n=daysUntil(d);if(done)return fmtDate(d);if(n<0)return'! '+fmtDate(d)+' ('+Math.abs(n)+'d)';if(n===0)return'hoje';if(n===1)return'amanha';return n<=3?fmtDate(d)+' ('+n+'d)':fmtDate(d)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function pad(n){return String(n).padStart(2,'0')}

// PERSIST
function loadAll(){
  try{tasks=JSON.parse(localStorage.getItem(TASK_KEY))||[];}catch(e){tasks=[];}
  try{events=JSON.parse(localStorage.getItem(EVENT_KEY))||[];}catch(e){events=[];}
  tasks.forEach(t=>{if(!t.status)t.status=t.done?'done':'todo';});
}
function saveAll(){
  localStorage.setItem(TASK_KEY,JSON.stringify(tasks));
  localStorage.setItem(EVENT_KEY,JSON.stringify(events));
  const el=document.getElementById('saved-msg');
  el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400);
}

// EXPORT / IMPORT
function exportData(){
  const blob=new Blob([JSON.stringify({tasks,events},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='painel-'+todayStr()+'.json';a.click();
  URL.revokeObjectURL(url);
}
function importData(ev){
  const file=ev.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.tasks&&!data.events){alert('Arquivo invalido.');return;}
      if(!confirm('Substituir todos os dados atuais?'))return;
      if(data.tasks)tasks=data.tasks;
      if(data.events)events=data.events;
      saveAll();renderTasks();renderCal();
      if(selectedDate)renderDayPanel(selectedDate);
      alert('Importado com sucesso!');
    }catch(err){alert('Erro ao ler o arquivo.');}
    ev.target.value='';
  };
  reader.readAsText(file);
}

// TASKS
function addTask(){
  const t=document.getElementById('new-title').value.trim();
  if(!t){document.getElementById('new-title').focus();return;}
  const status=document.getElementById('new-status').value;
  tasks.unshift({id:Date.now(),title:t,frente:document.getElementById('new-frente').value,pri:document.getElementById('new-pri').value,due:document.getElementById('new-due').value||null,obs:document.getElementById('new-obs').value.trim(),status,done:status==='done',doneAt:status==='done'?todayStr():null,created:todayStr()});
  document.getElementById('new-title').value='';document.getElementById('new-due').value='';document.getElementById('new-obs').value='';
  saveAll();renderTasks();
}
document.getElementById('new-title').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});

function moveTask(id,ns){const t=tasks.find(x=>x.id===id);if(!t)return;t.status=ns;t.done=ns==='done';t.doneAt=ns==='done'?todayStr():null;saveAll();renderTasks();}
function removeTask(id){if(!confirm('Excluir esta tarefa?'))return;tasks=tasks.filter(x=>x.id!==id);saveAll();renderTasks();}

function openEdit(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  editTaskId=id;
  document.getElementById('e-title').value=t.title;
  document.getElementById('e-frente').value=t.frente;
  document.getElementById('e-pri').value=t.pri;
  document.getElementById('e-status').value=t.status;
  document.getElementById('e-due').value=t.due||'';
  document.getElementById('e-obs').value=t.obs||'';
  document.getElementById('modal-task').style.display='flex';
}
function saveTaskEdit(){
  const t=tasks.find(x=>x.id===editTaskId);if(!t)return;
  const ns=document.getElementById('e-status').value;
  t.title=document.getElementById('e-title').value.trim()||t.title;
  t.frente=document.getElementById('e-frente').value;
  t.pri=document.getElementById('e-pri').value;
  t.due=document.getElementById('e-due').value||null;
  t.obs=document.getElementById('e-obs').value.trim();
  t.status=ns;t.done=ns==='done';t.doneAt=ns==='done'?(t.doneAt||todayStr()):null;
  document.getElementById('modal-task').style.display='none';
  saveAll();renderTasks();
}
document.getElementById('e-title').addEventListener('keydown',e=>{if(e.key==='Enter')saveTaskEdit()});

function setView(v){taskView=v;document.getElementById('view-list').style.display=v==='list'?'block':'none';document.getElementById('view-kanban').style.display=v==='kanban'?'block':'none';document.getElementById('btn-list').classList.toggle('active',v==='list');document.getElementById('btn-kanban').classList.toggle('active',v==='kanban');renderTasks();}
function setFilter(f,btn){filter=f;document.querySelectorAll('#view-list .fbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTasks();}
function setKFilter(f,btn){kfilter=f;document.querySelectorAll('#kanban-filters .fbtn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTasks();}

function applyFilter(arr,f){
  if(f==='abertas')return arr.filter(t=>t.status!=='done');
  if(f==='hoje')return arr.filter(t=>t.due&&daysUntil(t.due)===0&&t.status!=='done');
  if(f==='amanha')return arr.filter(t=>t.due&&daysUntil(t.due)===1&&t.status!=='done');
  if(f==='vencidas')return arr.filter(t=>t.status!=='done'&&t.due&&daysUntil(t.due)<0);
  if(f==='alta')return arr.filter(t=>t.pri==='alta'&&t.status!=='done');
  if(['produttare','iomt','mestrado','ind4','pessoal'].includes(f))return arr.filter(t=>t.frente===f);
  return arr;
}

function cardHTML(t,drag){
  const overdue=t.status!=='done'&&t.due&&daysUntil(t.due)<0;
  const dt=dueTxt(t.due,t.done),dc=dueClass(t.due,t.done);
  let ns,nl;if(t.status==='todo'){ns='progress';nl='&rarr;';}else if(t.status==='progress'){ns='done';nl='&#10003;';}else{ns='todo';nl='&#8635;';}
  const da=drag?'draggable="true" ondragstart="onDragStart(event,'+t.id+')" ondragend="onDragEnd()"':'';
  return '<div class="task-card '+(t.done?'done':'')+' '+(overdue?'overdue':'')+'" id="tc-'+t.id+'" '+da+'>'+
    '<button class="check-btn '+(t.done?'done':'')+'" onclick="moveTask('+t.id+',\''+ns+'\')" title="Avancar">'+nl+'</button>'+
    '<div class="task-body"><div class="task-title">'+esc(t.title)+'</div>'+
    '<div class="task-meta"><span class="badge badge-'+t.frente+'">'+(LABELS[t.frente]||t.frente)+'</span>'+
    '<span class="badge badge-pri-'+t.pri+'">'+(PRI[t.pri]||t.pri)+'</span>'+
    (dt?'<span class="due-tag '+(t.done?'':dc)+'">'+dt+'</span>':'')+
    (t.done&&t.doneAt?'<span class="date-hint">'+fmtDate(t.doneAt)+'</span>':'')+'</div>'+(t.obs?'<div style="font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4">'+esc(t.obs)+'</div>':'')+'</div>'+
    '<div class="task-actions"><button class="icon-btn edit" onclick="openEdit('+t.id+')" title="Editar">&#9998;</button>'+
    '<button class="icon-btn" onclick="removeTask('+t.id+')" title="Excluir">&#10005;</button></div></div>';
}

function renderTasks(){renderTodayObs();
  updateStats();
  if(taskView==='kanban'){
    const cols={todo:[],progress:[],done:[]};
    applyFilter([...tasks],kfilter).forEach(t=>{if(cols[t.status])cols[t.status].push(t);});
    ['todo','progress','done'].forEach(s=>{
      cols[s].sort((a,b)=>{if(!a.due&&!b.due)return 0;if(!a.due)return 1;if(!b.due)return-1;return a.due.localeCompare(b.due);});
      document.getElementById('cnt-'+s).textContent=cols[s].length;
      document.getElementById('cards-'+s).innerHTML=cols[s].length?cols[s].map(t=>cardHTML(t,true)).join(''):'<div class="empty-col">-</div>';
    });
  } else {
    let vis=applyFilter([...tasks],filter);
    vis.sort((a,b)=>{if(a.done!==b.done)return a.done?1:-1;if(!a.due&&!b.due)return 0;if(!a.due)return 1;if(!b.due)return-1;return a.due.localeCompare(b.due);});
    document.getElementById('list-cards').innerHTML=vis.length?vis.map(t=>cardHTML(t,false)).join(''):'<div class="empty-list">Nenhuma tarefa aqui</div>';
  }
}

function updateStats(){
  document.getElementById('s-total').textContent=tasks.length;
  document.getElementById('s-todo').textContent=tasks.filter(t=>t.status==='todo').length;
  document.getElementById('s-prog').textContent=tasks.filter(t=>t.status==='progress').length;
  document.getElementById('s-overdue').textContent=tasks.filter(t=>t.status!=='done'&&t.due&&daysUntil(t.due)<0).length;
}

function onDragStart(e,id){dragId=id;setTimeout(()=>{const el=document.getElementById('tc-'+id);if(el)el.classList.add('dragging');},0);e.dataTransfer.effectAllowed='move';}
function onDragEnd(){if(dragId){const el=document.getElementById('tc-'+dragId);if(el)el.classList.remove('dragging');}}
function onDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function onDrop(e,s){e.preventDefault();e.currentTarget.classList.remove('drag-over');if(dragId){moveTask(dragId,s);dragId=null;}}

// PAGE NAV
function showPage(p,btn){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  btn.classList.add('active');
  if(p==='agenda'){renderCal();}
}

// AGENDA HELPERS
function eventsForDate(d){return events.filter(e=>e.date===d);}
function periodClass(e){return e.text.toLowerCase().includes('feriado')?'ev-feriado':'ev-'+e.period;}
function periodLabel(p){return p==='D'?'D':p;}

function toggleTimeField(){
  const p=document.getElementById('ev-period').value;
  document.getElementById('ev-time-field').style.display=p==='H'?'grid':'none';
}
function toggleRecurField(){
  const r=document.getElementById('ev-recur').value;
  document.getElementById('ev-recur-end-field').style.display=r!=='none'?'block':'none';
}

function resetEventModal(){
  document.getElementById('ev-text').value='';
  document.getElementById('ev-period').value='T';
  document.getElementById('ev-time-field').style.display='none';
  document.getElementById('ev-time').value='08:00';
  document.getElementById('ev-time-end').value='09:00';
  document.getElementById('ev-obs').value='';
  document.getElementById('ev-location').value='';
  document.getElementById('ev-recur').value='none';
  document.getElementById('ev-recur-end').value='';
  document.getElementById('ev-recur-end-field').style.display='none';
  document.getElementById('ev-del-btn').style.display='none';
}

function openNewEvent(){
  editEventId=null;
  document.getElementById('ev-modal-title').textContent='Novo evento';
  resetEventModal();
  document.getElementById('ev-date').value=todayStr();
  document.getElementById('modal-event').style.display='flex';
  setTimeout(()=>document.getElementById('ev-text').focus(),100);
}

function openNewEventOnDate(ds){
  editEventId=null;
  document.getElementById('ev-modal-title').textContent='Novo evento';
  resetEventModal();
  document.getElementById('ev-date').value=ds;
  document.getElementById('modal-event').style.display='flex';
  setTimeout(()=>document.getElementById('ev-text').focus(),100);
}

function openEditEvent(id){
  const e=events.find(x=>x.id===id);if(!e)return;
  editEventId=id;
  document.getElementById('ev-modal-title').textContent='Editar evento';
  resetEventModal();
  let displayText=e.text;
  if(e.period==='H'&&e.timeLabel){displayText=e.text.replace(e.timeLabel+' ','');}
  document.getElementById('ev-text').value=displayText;
  document.getElementById('ev-date').value=e.date;
  document.getElementById('ev-period').value=e.period;
  document.getElementById('ev-time').value=e.time||'08:00';
  document.getElementById('ev-time-end').value=e.timeEnd||'09:00';
  document.getElementById('ev-time-field').style.display=e.period==='H'?'grid':'none';
  document.getElementById('ev-obs').value=e.obs||'';
  document.getElementById('ev-location').value=e.location||'';
  document.getElementById('ev-del-btn').style.display='inline-flex';
  document.getElementById('modal-event').style.display='flex';
  setTimeout(()=>document.getElementById('ev-text').focus(),100);
}

function saveEvent(){
  const text=document.getElementById('ev-text').value.trim();
  const date=document.getElementById('ev-date').value;
  const period=document.getElementById('ev-period').value;
  const timeStart=period==='H'?document.getElementById('ev-time').value:'';
  const timeEnd=period==='H'?document.getElementById('ev-time-end').value:'';
  const obs=document.getElementById('ev-obs').value.trim();
  const location=document.getElementById('ev-location').value.trim();
  const recur=document.getElementById('ev-recur').value;
  const recurEnd=document.getElementById('ev-recur-end').value;
  if(!text||!date)return;
  let displayText=text, timeLabel='';
  if(period==='H'&&timeStart){
    timeLabel=timeEnd&&timeEnd!==timeStart?timeStart+'\u2013'+timeEnd:timeStart;
    displayText=timeLabel+' '+text;
  }
  if(editEventId){
    const e=events.find(x=>x.id===editEventId);
    if(e){e.text=displayText;e.date=date;e.period=period;e.time=timeStart;e.timeEnd=timeEnd;e.timeLabel=timeLabel;e.location=location;e.obs=obs;}
  } else {
    const baseEv={id:Date.now(),date,period,time:timeStart,timeEnd,timeLabel,text:displayText,location,obs,recurGroup:null};
    if(recur==='none'||!recurEnd){
      events.push(baseEv);
    } else {
      const groupId='grp-'+Date.now();
      const dates=generateDates(date,recur,recurEnd);
      dates.forEach((d,i)=>{events.push(Object.assign({},baseEv,{id:Date.now()+i+1,date:d,recurGroup:groupId}));});
    }
  }
  document.getElementById('modal-event').style.display='none';
  saveAll();renderCal();
  selectedDate=date;renderDayPanel(date);
}

function generateDates(startDate,recur,endDate){
  const dates=[];let cur=new Date(startDate+'T12:00:00');const end=new Date(endDate+'T12:00:00');
  while(cur<=end){
    dates.push(cur.toISOString().slice(0,10));
    if(recur==='daily')cur.setDate(cur.getDate()+1);
    else if(recur==='weekly')cur.setDate(cur.getDate()+7);
    else if(recur==='biweekly')cur.setDate(cur.getDate()+14);
    else if(recur==='monthly')cur.setMonth(cur.getMonth()+1);
    else break;
    if(dates.length>365)break;
  }
  return dates;
}

function removeEvent(id){
  const ev=events.find(e=>e.id===id);
  if(ev&&ev.recurGroup){
    if(confirm('Evento recorrente. Excluir todas as ocorrencias?')){
      events=events.filter(e=>e.recurGroup!==ev.recurGroup);
    } else {events=events.filter(e=>e.id!==id);}
  } else {events=events.filter(e=>e.id!==id);}
  saveAll();renderCal();
  if(selectedDate)renderDayPanel(selectedDate);
}

function deleteEvent(){if(editEventId)removeEvent(editEventId);document.getElementById('modal-event').style.display='none';}
document.getElementById('ev-text').addEventListener('keydown',e=>{if(e.key==='Enter')saveEvent()});

// CALENDAR
function changeMonth(d){calMonth+=d;if(calMonth>11){calMonth=0;calYear++;}if(calMonth<0){calMonth=11;calYear--;}renderCal();}

function renderCal(){
  document.getElementById('month-label').textContent=MONTHS[calMonth]+' '+calYear;
  const first=new Date(calYear,calMonth,1).getDay();
  const daysInM=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  const td=todayStr();
  let html='';
  for(let i=first-1;i>=0;i--){const d=prevDays-i,m=calMonth===0?11:calMonth-1,y=calMonth===0?calYear-1:calYear;html+=dayCell(y+'-'+pad(m+1)+'-'+pad(d),d,true,td);}
  for(let d=1;d<=daysInM;d++){html+=dayCell(calYear+'-'+pad(calMonth+1)+'-'+pad(d),d,false,td);}
  const total=first+daysInM,fill=total%7===0?0:7-(total%7);
  for(let d=1;d<=fill;d++){const m=calMonth===11?0:calMonth+1,y=calMonth===11?calYear+1:calYear;html+=dayCell(y+'-'+pad(m+1)+'-'+pad(d),d,true,td);}
  document.getElementById('cal-body').innerHTML=html;
  if(selectedDate)renderDayPanel(selectedDate);
  else document.getElementById('day-panel').style.display='none';
}

function dayCell(ds,dayNum,otherMonth,td){
  const evs=eventsForDate(ds);
  const cls=['cal-day',otherMonth?'other-month':'',ds===td?'today':''].filter(Boolean).join(' ');
  let evHTML=evs.slice(0,3).map(e=>'<div class="day-event '+periodClass(e)+'">'+esc(e.text)+'</div>').join('');
  if(evs.length>3)evHTML+='<div class="day-event" style="color:var(--muted)">+'+(evs.length-3)+'</div>';
  return '<div class="'+cls+'" onclick="selectDay(\''+ds+'\')"><div class="day-num">'+dayNum+'</div><div class="day-events">'+evHTML+'</div></div>';
}

function selectDay(ds){selectedDate=ds;renderDayPanel(ds);}

function renderDayPanel(ds){
  const panel=document.getElementById('day-panel');
  const[y,m,d]=ds.split('-');
  const dt=new Date(ds+'T12:00:00');
  const label=d+'/'+m+'/'+y+' ('+DOWS[dt.getDay()]+')';
  const evs=eventsForDate(ds);
  const isToday=ds===todayStr();
  const ORDER={H:0,D:1,M:2,T:3,N:4};
  let evHTML=evs.length
    ? evs.sort((a,b)=>(ORDER[a.period]||9)-(ORDER[b.period]||9)).map(e=>{
        const f=periodClass(e);
        const pl=periodLabel(e.period);
        const timeBadge=e.period==='D'?'<span class="dp-loc">08:00&ndash;17:00</span>':'';
        const locBadge=e.location?'<span class="dp-loc">&bull; '+esc(e.location)+'</span>':'';
        const recurBadge=e.recurGroup?'<span style="font-size:10px;background:#eeecfd;color:#3c3489;border-radius:20px;padding:1px 6px;font-family:DM Mono,monospace">&#8635;</span>':'';
        return '<div class="dp-ev">'+
          '<span class="dp-period '+f+'">'+pl+'</span>'+
          '<span class="dp-text">'+esc(e.text)+' '+timeBadge+locBadge+recurBadge+'</span>'+
          (e.obs?'<div style="font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4">'+esc(e.obs)+'</div>':'')+
          '<div class="dp-actions">'+
            '<button class="dp-btn edit" onclick="openEditEvent('+e.id+')" title="Editar">&#9998;</button>'+
            '<button class="dp-btn" onclick="removeEvent('+e.id+')" title="Excluir">&#10005;</button>'+
          '</div>'+
        '</div>';
      }).join('')
    : '<div class="dp-empty">Sem eventos</div>';

  panel.innerHTML='<div class="day-panel">'+
    '<div class="day-panel-header">'+
      '<span class="day-panel-title">'+label+(isToday?' <span style="font-size:11px;background:var(--green);color:#fff;border-radius:20px;padding:1px 8px;font-family:DM Mono,monospace;margin-left:6px">hoje</span>':'')+'</span>'+
      '<button class="btn-add" style="height:32px;font-size:12px;padding:0 12px" onclick="openNewEventOnDate(\''+ds+'\')">+ Evento</button>'+
    '</div>'+
    '<div class="day-panel-events">'+evHTML+'</div>'+
  '</div>';
  panel.style.display='block';
}

// SEED
(function(){
  const SK='alex-events-seeded-v1';
  if(localStorage.getItem(SK))return;

// AUTO CLEANUP: remove done tasks older than 7 days
function cleanOldDone(){
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-7);
  const before=tasks.length;
  tasks=tasks.filter(t=>{
    if(!t.done||!t.doneAt)return true;
    return new Date(t.doneAt+'T00:00:00')>=cutoff;
  });
  if(tasks.length<before)saveAll();
}

// TODAY OBS PANEL
function renderTodayObs(){
  const td=todayStr();
  const withObs=tasks.filter(t=>t.obs&&t.status!=='done');
  if(!withObs.length)return;
  const existing=document.getElementById('today-obs-panel');
  if(existing)existing.remove();
  const panel=document.createElement('div');
  panel.id='today-obs-panel';
  panel.style.cssText='background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:1.25rem';
  panel.innerHTML='<div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px">Observacoes abertas</div>'+
    withObs.map(t=>'<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:0.5px solid var(--border)">'+
      '<span class="badge badge-'+t.frente+'" style="flex-shrink:0;margin-top:2px">'+(LABELS[t.frente]||t.frente)+'</span>'+
      '<div><div style="font-size:13px;font-weight:500">'+esc(t.title)+'</div>'+
      '<div style="font-size:12px;color:var(--muted);margin-top:2px">'+esc(t.obs)+'</div></div>'+
    '</div>').join('')+
    '<div style="font-size:11px;color:var(--muted);margin-top:8px">'+withObs.length+' tarefa(s) com observacao</div>';
  const addSection=document.querySelector('.add-section');
  if(addSection)addSection.parentNode.insertBefore(panel,addSection);
}
